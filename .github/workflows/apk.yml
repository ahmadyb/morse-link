name: Build APK

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - 'app/release/**'
      - 'art/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble release
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect the APK
        run: |
          mkdir -p app/release
          cp app/build/outputs/apk/release/app-release.apk app/release/morse-link.apk
          ls -la app/release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: morse-link-apk
          path: app/release/morse-link.apk
          if-no-files-found: error

      - name: Commit the APK back to the branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f app/release/morse-link.apk
          if git diff --cached --quiet; then
            echo "APK is unchanged"
          else
            git commit -m "build: refresh MorseLink APK [skip ci]"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
