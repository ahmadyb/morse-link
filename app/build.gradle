plugins {
    id 'com.android.application'
}

android {
    namespace 'com.morselink.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.morselink.app"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
        resourceConfigurations += ["en"]
    }

    signingConfigs {
        // Demo keystore committed with the project so the APK is signed
        // (and therefore installable) for anyone who clones the repo.
        release {
            storeFile file("../keystore/morse-link.jks")
            storePassword "morselink"
            keyAlias "morselink"
            keyPassword "morselink"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Zero third-party dependencies: MorseLink is built on the Android framework only.
}
